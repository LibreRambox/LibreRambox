productName: LibreRambox
appId: io.github.librerambox
asar: true
mac:
  category: public.app-category.productivity
  artifactName: LibreRambox-${version}-mac-${arch}.${ext}
  target:
    - target: default
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/installer/entitlements.mac.plist
  entitlementsInherit: resources/installer/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Apps inside LibreRambox may need access to your microphone. Please, grant access to have a better experience.
    NSCameraUsageDescription: Apps inside LibreRambox may need access to your camera. Please, grant access to have a better experience.
    NSAudioCaptureUsageDescription: Apps inside LibreRambox may need access to system audio for screen sharing. Please, grant access to have a better experience.
dmg:
  title: LibreRambox
  iconSize: 128
  contents:
    - x: 355
      y: 125
      type: link
      path: /Applications
    - x: 155
      y: 125
      type: file
win:
  artifactName: LibreRambox-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip
nsis:
  deleteAppDataOnUninstall: true
  oneClick: false
  perMachine: false
  runAfterFinish: true
snap:
  plugs:
    - default
    - camera
    - audio-record
    - audio-playback
    - removable-media
    - raw-usb
    - u2f-devices
    - cups-control
linux:
  icon: resources/installer/icons
  category: Network
  desktop:
    entry:
      Terminal: "false"
      Type: Application
      Categories: GTK;GNOME;Network;Email;Chat;InstantMessaging;
  artifactName: LibreRambox-${version}-linux-${arch}.${ext}
  executableArgs:
    - --no-sandbox
  target:
    - target: snap
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: zip
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
directories:
  buildResources: resources/installer/
  output: dist/
