name: Publish Binaries

on:
  release:
    types: [published]

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Require pre-release flag for pre-release tags
        shell: bash
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME looks like a pre-release but the release is not marked as pre-release"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:renderer

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        job_name:
          - linux
          - osx
          - win
        include:
          - job_name: linux
            os: ubuntu-latest
          - job_name: osx
            os: macos-15
          - job_name: win
            os: windows-latest

    name: '${{ matrix.job_name }}'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
      - run: npm ci
      - name: Set version from release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Build Linux
      - name: Build on Linux
        run: 'npm run build:linux'
        if: success() && matrix.job_name == 'linux'

      - name: Upload Linux Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/LibreRambox-*-linux-amd64.deb
            dist/LibreRambox-*-linux-amd64.snap
            dist/LibreRambox-*-linux-x86_64.AppImage
            dist/LibreRambox-*-linux-x86_64.rpm
            dist/LibreRambox-*-linux-x64.tar.gz
            dist/LibreRambox-*-linux-x64.zip
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.job_name == 'linux'

      # Build OSX
      - name: Build on OSX
        run: 'npm run build:osx'
        if: success() && matrix.job_name == 'osx'


      - name: Upload OSX Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/LibreRambox-*-mac-universal.zip
            dist/LibreRambox-*-mac-universal.dmg
            dist/LibreRambox-*-mac-universal.dmg.blockmap
            dist/LibreRambox-*-mac-arm64.zip
            dist/LibreRambox-*-mac-arm64.dmg
            dist/LibreRambox-*-mac-arm64.dmg.blockmap
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.job_name == 'osx'

      # Build Windows
      - name: Build on Windows
        run: 'npm run build:win'
        if: success() && matrix.job_name == 'win'

      - name: Upload Windows Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/LibreRambox-*-win.exe
            dist/LibreRambox-*-win-x64.zip
            dist/LibreRambox-*-win.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.job_name == 'win'

  bump-master:
    name: Bump version on master
    needs: build
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
      - name: Bump version on master if the tag is newer
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NEW="${GITHUB_REF_NAME#v}"
          if ! npx --yes semver@7.6.3 -r ">$CURRENT" "$NEW" > /dev/null; then
            echo "::notice::master is at $CURRENT, not lowering it to $NEW"
            exit 0
          fi
          npm version "$NEW" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${GITHUB_REF_NAME#v} [skip ci]"
          git push origin master
