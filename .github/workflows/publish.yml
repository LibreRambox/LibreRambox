name: Publish Binaries

on:
  release:
    types: [published]

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
      - run: npm i
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:renderer

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        job_name:
          - linux
          - osx
          - win
        include:
          - job_name: linux
            os: ubuntu-latest
          - job_name: osx
            os: macos-15
          - job_name: win
            os: windows-latest

    name: '${{ matrix.job_name }}'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/krypton
      - run: npm i

      # Build Linux
      - name: Build on Linux
        run: 'npm run build:linux'
        if: success() && matrix.job_name == 'linux'

      - name: Upload Linux Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/LibreRambox-*-linux-amd64.deb
            dist/LibreRambox-*-linux-amd64.snap
            dist/LibreRambox-*-linux-x86_64.AppImage
            dist/LibreRambox-*-linux-x86_64.rpm
            dist/LibreRambox-*-linux-x64.tar.gz
            dist/LibreRambox-*-linux-x64.zip
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.job_name == 'linux'

      # Build OSX
      - name: Build on OSX
        run: 'npm run build:osx'
        if: success() && matrix.job_name == 'osx'

      # Apple Silicon only build. latest-mac.yml (read by the auto-updater) must keep
      # describing the universal build, so it is saved before and restored after.
      - name: Build on OSX (arm64)
        run: |
          cp dist/latest-mac.yml "$RUNNER_TEMP/latest-mac.yml"
          npx electron-builder --macos --arm64 -p never
          cp "$RUNNER_TEMP/latest-mac.yml" dist/latest-mac.yml
        if: success() && matrix.job_name == 'osx'

      - name: Upload OSX Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/LibreRambox-*-mac-universal.zip
            dist/LibreRambox-*-mac-universal.dmg
            dist/LibreRambox-*-mac-universal.dmg.blockmap
            dist/LibreRambox-*-mac-arm64.zip
            dist/LibreRambox-*-mac-arm64.dmg
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.job_name == 'osx'

      # Build Windows
      - name: Build on Windows
        run: 'npm run build:win'
        if: success() && matrix.job_name == 'win'

      - name: Upload Windows Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/LibreRambox-*-win.exe
            dist/LibreRambox-*-win-x64.zip
            dist/LibreRambox-*-win.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.job_name == 'win'
